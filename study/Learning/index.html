{
id:'01',title:'先建立一个可信的学习问题',en:'Learning & generalization',phase:'基础',week:'Week 1',time:'60–90 分钟',lab:'split',
goal:'能定义输入、输出、损失与评价指标，并解释为什么训练效果好不等于学会。',prereq:'向量、均值、条件概率；会读 Python 数组。',
chain:['样本与标签','划分数据','学习参数','验证选型','一次性测试'],
concepts:[C('学习到底在调整什么？','监督学习给定样本 (x, y)，用带参数的函数 fθ(x) 预测 y。训练调整 θ 来降低训练集上的平均损失；模型结构、学习率、正则化强度等超参数通常通过验证集选择。分类输出可以是类别概率，回归输出是连续数值。无监督学习没有同样的类别标签；自监督学习从数据自身构造监督信号。'),C('训练、验证与测试各有一个职责','训练集用于更新参数，验证集用于模型选择和早停，测试集用于最终估计泛化。标准化的均值与方差也只能从训练集拟合。若反复看测试表现来调参，测试集事实上就成了验证集。时间序列应尊重时间顺序；同一个人的近重复样本不宜随机落入不同集合。'),C('把容量与数据量放在一起看','欠拟合常表现为训练和验证误差都高；过拟合常表现为训练误差低、验证误差高。增加容量可能改善欠拟合，也可能扩大泛化差距。验证曲线是诊断线索，不能仅凭两条曲线断言唯一原因；还要排查分布差异、标签错误和数据泄漏。'),C('损失与指标不是同一个东西','可微的交叉熵便于优化；accuracy、precision、recall、F1 等回答不同业务问题。1% 阳性的数据上全预测阴性可得 99% accuracy，却一个阳性也找不到。确定正类、阈值和误判代价后再选指标。多分类宏平均与微平均也不能混用。')],
formula:'J(θ) = (1/N) Σᵢ ℓ(fθ(xᵢ), yᵢ) + λR(θ)\nprecision = TP / (TP + FP)\nrecall = TP / (TP + FN)\nF1 = 2PR / (P + R)',
worked:'100 个样本中有 10 个正类。模型预测 8 个正类，其中 6 个正确：TP=6、FP=2、FN=4、TN=88。accuracy=94%，precision=75%，recall=60%，F1≈66.7%。这四个数共同描述了同一个模型，不能相互替代。',

practice:['在 Tutorial02 中先定位数据读取、模型拟合与误差计算，画出数据流。','复制一份 Notebook 做实验；固定一份验证集，对比线性模型与更高容量模型。只改变容量，保留同一数据划分。','提交一张训练/验证曲线和一段解释：观察支持欠拟合还是过拟合？你还要排查什么？'],

},
{
id:'02',title:'把一次训练拆成六个动作',en:'Tensors & the training loop',phase:'基础',week:'Tutorial 1–2',time:'60–90 分钟',lab:'gradient',
goal:'能解释张量形状、自动微分与训练循环，写出一次完整参数更新。',prereq:'第 01 课；矩阵乘法与导数。',chain:['取一个 batch','前向计算','标量损失','清空旧梯度','反向传播','更新参数'],
concepts:[C('先写形状，再写模型','使用行样本约定：输入 X 是 [B,D]，线性层权重按数学写法 W 是 [D,H]，输出 XW+b 是 [B,H]。PyTorch 的 nn.Linear(D,H) 内部 weight 则是 [H,D]，执行 X·weightᵀ+b。看到转置先核对约定，不要机械搬公式。'),C('自动微分记录的是运算关系','前向运算构成计算图。对标量 loss 调用 backward()，按链式法则把梯度累加到叶子参数的 .grad。它不负责更新参数；optimizer.step() 才做更新。Python 数字化或 detach 会切断对应路径，不能在需要梯度的中间值上随意使用。'),C('为什么要清空梯度？','默认反向会累加梯度。普通训练通常每个 batch 在 backward 前清零；梯度累积训练则有意累加多个 batch 后再更新，并正确缩放损失。清零与累积各有用途，问题在于是否符合你的设计。'),C('训练模式与梯度开关是两条轴','model.eval() 改变 Dropout 和 BatchNorm 等模块的行为，不自动关闭梯度。torch.no_grad() 关闭梯度记录，不自动切换模型模式。验证通常两者都用。恢复训练后要调用 model.train()。不要把验证样本送入训练模式的 BatchNorm 来更新统计量。')],
formula:'X: [B,D] → Linear(D,H) → [B,H] → ReLU → Linear(H,C) → [B,C]\nloss = CrossEntropyLoss(logits, labels)  # labels: [B], 整数类别\nθₜ₊₁ = θₜ − η · ∇θ loss',
worked:'B=32、D=20、H=8、C=3 时，第一层参数为 20×8+8=168，第二层为 8×3+3=27，总共 195。batch 从 32 改成 64 不会改变参数量。分类 logits 是 [32,3]，标签是 [32]，通常为 torch.long。',
pitfall:'CrossEntropyLoss 接收未归一化的 logits。先 softmax 再送入它会改变实际计算，通常不是你想优化的目标。',
practice:['运行附带的 CPU MLP 小实验，逐行找到 zero_grad、forward、loss、backward、step。','把 batch 形状和每层参数形状打印出来；确认与纸上计算一致。','在复制的实验中故意去掉 zero_grad，对比参数梯度和 loss 曲线；恢复后写明梯度累加发生在哪里。'],
accept:['能把六个动作按因果顺序复述。','能解释 eval 与 no_grad 的区别。','能说明 .backward() 后但 .step() 前参数为什么尚未更新。'],
refs:[R('Tutorial01 · 工具入门','Tutorials/Tutorial01/tutorial1.pdf'),R('A1 · PyTorch MLP','Assignments/CIE6032-Assignment1-Due-260618/Coding/Planar_MLP_PyTorch.ipynb')],download:'labs/mlp_cpu.py',
quiz:[Q('02a','Linear(20,8) 包含偏置，共多少参数？',['160','168','256'],1,'20×8 个权重，加上 8 个偏置。'),Q('02b','loss.backward() 的主要作用是什么？',['立即更新权重','计算并累加梯度','切换成评估模式'],1,'更新由 optimizer.step() 完成，backward 计算梯度。'),Q('02c','只调用 model.eval() 会怎样？',['关闭所有梯度记录','冻结所有参数','改变特定层行为，但仍可计算梯度'],2,'eval 影响 Dropout/BatchNorm 等；梯度记录需要单独控制。')]
},
{
id:'03',title:'从 MLP 推出反向传播',en:'MLP, cross-entropy & backprop',phase:'基础',week:'Week 2 · A1',time:'120 分钟',lab:'softmax',
goal:'能从损失沿计算图推导两层网络梯度，并用数值差分验证。',prereq:'第 02 课；链式法则、逐元素乘法。',chain:['线性变换','非线性激活','输出 logits','softmax + CE','误差信号反传','共享分支梯度求和'],
concepts:[C('非线性为什么必要？','没有激活函数，多层线性变换仍等价于一个线性变换。ReLU、sigmoid、tanh 引入非线性，使网络能够表达弯曲决策边界。sigmoid 在大正值或负值附近导数很小；ReLU 正区间导数为 1，但负区间可能长期不更新。不能无条件断言 ReLU 一定学得更快。'),C('从概率到交叉熵','softmax 把 logits 转成类别概率。对正确类的负对数概率做损失，就是单样本负对数似然；独立样本的似然相乘，取对数后变成求和。平均损失和总负对数似然差一个常数因子。减去最大 logit 再求指数可改善数值稳定性。'),C('关键简化：输出梯度等于 p−y','softmax 的类别互相耦合，而交叉熵与它组合后，单样本对 logits 的梯度简化成 p−y。该式假定 y 是和为 1 的目标分布，且未再加样本权重等项。batch 平均时别忘除以 B。然后按线性层和激活层的局部导数向前一层传。'),C('共享参数只计一份，梯度收两路','Siamese 两个分支共用 W,b，参数量不会因为执行两次而翻倍。总梯度是来自两条路径的贡献相加，再加正则项梯度。相同输入不等于参数共享；伪 Siamese 若 W₁、W₂ 独立，就分别更新。')],
formula:'行样本约定：A₁=XW₁+b₁，H=σ(A₁)，Z=HW₂+b₂\nP=softmax(Z)，L=−(1/B)ΣᵢΣ꜀ Yᵢ꜀ log Pᵢ꜀\nδ₂=(P−Y)/B；∂L/∂W₂=Hᵀδ₂\nδ₁=(δ₂W₂ᵀ) ⊙ σ′(A₁)；∂L/∂W₁=Xᵀδ₁\n∂L/∂b = 沿 batch 维求和',
worked:'三分类 logits=[0,0,0]，正确类别为第 2 类。概率为 [1/3,1/3,1/3]，损失 ln3≈1.099，对 logits 的梯度是 [1/3,−2/3,1/3]。梯度下降让正确类 logit 增大、其他类减小。',
pitfall:'不要把局部导数 σ′(A) 漏掉；也不要给已除以 B 的梯度再除一次。做数值梯度检查时避开 ReLU 的不可导点 0。',
practice:['在 A1 的 Planar_MLP.ipynb 按 initialize_parameters → forward_propagation → compute_cost → backward_propagation → update_parameters → nn_model 阅读。','独立推导一层权重的梯度，并运行附带的纯 Python 数值梯度实验。','在自己的复制件中比较手写反传与 autograd：相同权重、输入、损失归约方式下梯度应接近。'],
accept:['能为 X、H、W₁、W₂ 和每个梯度标注形状。','能解释 p−y 的符号与参数更新方向。','数值差分误差在合理浮点容差内，并能说明共享参数梯度为何相加。'],
refs:[R('MLP 课件','Lectures/Week02/Week2_MLP.pdf'),R('A1 · 题目','Assignments/CIE6032-Assignment1-Due-260618/CIE6032-Assignment1-Due-260618.pdf'),R('A1 · 手写 MLP','Assignments/CIE6032-Assignment1-Due-260618/Coding/Planar_MLP.ipynb')],download:'labs/gradient_check.py',
quiz:[Q('03a','单样本 softmax+CE 对 logits 的梯度为？',['p−y','y−p','p(1−p)'],0,'组合损失的梯度是 p−y；梯度下降会提高正确类别的 logit。'),Q('03b','共享的 W 为 [10,5]，b 为 [10]，Siamese 两个分支共多少参数？',['120','60','100'],1,'同一份 W,b 被使用两次，50+10=60；两路梯度相加。'),Q('03c','三个 logits 同时加 100，softmax 概率怎样变化？',['不变','变得更均匀','正确类概率提高'],0,'分子分母同时乘 e¹⁰⁰，比例不变；稳定实现通常减去最大值。')]
},
{
id:'04',title:'让卷积看懂局部结构',en:'Convolution & receptive fields',phase:'视觉',week:'Week 2 · A2',time:'90–120 分钟',lab:'convolution',
goal:'能计算卷积输出形状、参数量和感受野，并解释参数共享。',prereq:'第 03 课；张量的 batch/channel/height/width。',chain:['NCHW 图像','局部滑窗','跨通道求和','生成特征图','激活与下采样','分类头'],
concepts:[C('卷积在共享什么？','一个输出通道对应一组覆盖所有输入通道的卷积核。这组权重在空间位置复用，提取某种局部模式。深度学习库通常实现互相关，即不翻转卷积核；课程语境常统一称卷积。卷积的平移等变性不等于分类结果自动平移不变，边界与步幅也会影响它。'),C('输出大小来自窗口放得下多少次','padding 扩展边界，stride 控制相邻窗口间距，dilation 控制核采样点间距。先算有效核宽 d(k−1)+1，再计算合法窗口数量。H 和 W 分别算；输入太小或参数不合法时应明确报错，而不是给负维度。'),C('参数量与图片面积无关','标准卷积参数量为 C_out×(C_in×k_h×k_w+1)，其中 +1 是每个输出通道的偏置。特征图的 H×W 决定计算和激活内存，但不直接改变该层参数量。分组卷积、深度可分离卷积的公式不同。'),C('堆叠小核与逐步扩大视野','两个 stride=1 的 3×3 卷积，理论感受野达到 5×5，同时插入了额外非线性。池化降低空间分辨率，带来信息损失。感受野描述可能影响输出的位置范围，不代表所有位置的实际影响一样大。')],

id:'05',title:'理解深层网络为什么能训练',en:'Architectures, residuals & normalization',phase:'视觉',week:'Week 3',time:'90 分钟',lab:null,
goal:'能解释残差连接、归一化和正则化各自解决的问题。',prereq:'第 04 课；梯度的链式传播。',chain:['特征提取块','归一化与激活','残差相加','更深的表示','全局池化','分类'],
concepts:[C('从架构名称退回设计问题','AlexNet 展示更深 CNN 的能力；VGG 用规则堆叠的小卷积核；Inception 在分支间组合多尺度特征；ResNet 加入残差路径。学习时不要只背层数，要能比较计算、参数、信息流和优化难度。'),C('残差路径给梯度一条直接路线','残差块 y=x+F(x) 的梯度包含恒等项 I。网络可以在恒等映射上学习修正，从而缓解某些深度优化问题。但残差不保证不会过拟合，也不保证任意网络都稳定。输入输出形状不一致时，需要投影或相应的维度处理后才能相加。'),C('BatchNorm 依赖训练与推理状态','BatchNorm 按其规范化轴计算均值方差，再用可学习缩放和平移恢复表达能力。训练通常用 batch 统计并更新运行统计；评估通常用运行统计。小 batch、分布变化或错误模式切换会影响结果。它不是简单地让所有层输出永远标准正态。'),C('Dropout 是训练期扰动','倒置 Dropout 训练时随机保留激活并按 1/(1−p) 缩放，使期望保持；评估时不再随机丢弃。权重衰减直接约束参数；数据增强约束对变换的鲁棒性。这些机制不能当作互相完全等价的开关。')],
formula:'残差：y = x + F(x)\n∂y/∂x = I + ∂F/∂x\nBatchNorm：x̂ = (x−μ)/√(σ²+ε)，y = γx̂+β\n倒置 Dropout：训练 y = m⊙x/(1−p)，m~Bernoulli(1−p)',
worked:'残差主分支输出 [B,64,16,16]，旁路仍是 [B,32,32,32]，不能直接相加。可以用 1×1、stride=2 的投影卷积把旁路变为 [B,64,16,16]。此投影会增加参数，不再是纯恒等映射。',

practice:['在分类网络课件中比较 VGG、Inception、ResNet，分别写一句“结构变化→可能收益→代价”。','在 CPU 张量实验中检查残差块输入输出，尝试制造尺寸不匹配并读懂报错。','在同一个小模型上分别启用 Dropout 和权重衰减，保留控制变量记录；不要把单次结果当成普遍结论。'],

{
id:'06',title:'用曲线诊断优化问题',en:'SGD, momentum & Adam',phase:'基础',week:'Week 3 · A2',time:'90–120 分钟',lab:'gradient',
goal:'能解释学习率、动量和自适应步长，制定可验证的训练诊断顺序。',prereq:'第 03 课；梯度与指数滑动平均。',chain:['计算 batch 梯度','更新一阶/二阶统计','决定更新幅度','监控训练与验证','调整计划'],
concepts:[C('学习率决定走多远','梯度给出局部最陡上升方向，负梯度是下降方向，但有限步长不保证损失下降。二次函数上可以精确看到稳定区间；真实深网更复杂。学习率过小可能进展缓慢，过大可能震荡或发散。batch 变化也会改变梯度噪声。'),C('动量让方向具有记忆','动量平滑历史梯度，可减少某些来回摆动，在方向一致处积累速度。不同实现对动量系数与学习率的写法可能不同，比较公式时先统一约定。动量不是简单把所有梯度放大同一个倍数。'),C('Adam 维护两个统计量','一阶矩估计方向，二阶原始矩估计梯度平方尺度；偏置修正补偿零初始化带来的早期偏差。固定一阶矩时，分母越大更新越小，但实际更新由分子、分母和学习率共同决定。Adam 不保证比 SGD 泛化更好。'),C('先验证能学，再追求更好','先在几十个样本上过拟合，排查形状、标签、loss 与梯度；再检查数据划分、训练/验证模式、归一化与学习率。记录种子和指标，改变一个主要变量。NaN 时从输入、loss、梯度范数、参数范围逐段定位。')],
formula:'gₜ = ∇θ L_batch\nmₜ=β₁mₜ₋₁+(1−β₁)gₜ；vₜ=β₂vₜ₋₁+(1−β₂)gₜ²\nm̂ₜ=mₜ/(1−β₁ᵗ)；v̂ₜ=vₜ/(1−β₂ᵗ)\nθₜ₊₁=θₜ−η m̂ₜ/(√v̂ₜ+ε)\nL(w)=½aw² 时，GD 稳定条件：0<ηa<2',
worked:'L(w)=½×2w²，w₀=3。η=0.1 时 w₁=2.4；η=0.75 时 w₁=−1.5，符号翻转但绝对值缩小；η=1.1 时 w₁=−3.6，开始发散。可见“跨过最优点”与“发散”不是同一回事。',
pitfall:'不能只比较最后一个 epoch 的训练 loss 来选择优化器。检查验证表现、计算预算、超参数搜索公平性和多次运行波动。',
practice:['在互动实验里预测三种学习率的轨迹，再验证预测。','沿 A2 fully_connected_networks.py 的 sgd → sgd_momentum → rmsprop → adam 比较状态变量。','运行 CPU MLP 实验，记录小样本过拟合能力，再在固定划分上比较两种学习率。'],

refs:[R('Optimization','Lectures/Week03/week3_Optimization.pdf'),R('Tutorial07 · 优化器','Tutorials/Tutorial07/Tutorial7.ipynb'),R('A2 · 更新规则','Assignments/Assignment2/A2_coding/MLP_CNN/fully_connected_networks.py')],
quiz:[Q('06a','L(w)=½×2w²，普通梯度下降的稳定学习率区间？',['0<η<1','0<η<2','任意正数'],0,'需要 |1−2η|<1，因此 0<η<1。'),Q('06b','Adam 的 v 通常累计什么？',['梯度的均值','梯度的平方','参数的绝对值'],1,'v 是二阶原始矩的指数滑动估计，不是减去均值后的方差。'),Q('06c','小模型连 32 个训练样本都无法拟合，优先做什么？',['先加更多层','先排查数据、loss、梯度与更新流程','先报告模型泛化很好'],1,'小样本过拟合检查帮助排除实现和配置错误。')]

{
id:'07',title:'沿时间展开 RNN',en:'RNN, BPTT & LSTM',phase:'序列',week:'Week 4 · A2',time:'120 分钟',lab:null,
goal:'能把序列计算展开成共享参数的图，解释 BPTT、梯度消失与 LSTM 门控。',prereq:'第 03、06 课；理解共享参数梯度相加。',chain:['token/特征输入','更新隐藏状态','逐时刻输出','累计序列损失','沿时间反传','生成时反馈预测'],
concepts:[C('状态把历史压缩到当前','普通 RNN 在每个时刻读入 xₜ 与 hₜ₋₁，产生 hₜ；各时刻共用同一组参数。状态让过去影响现在，但固定维度的状态并不能无损保存任意长历史。输入序列、输出序列与 mask 的长度必须核对。'),C('BPTT 是在展开图上做反传','未来损失会沿隐藏状态链影响早期参数。对共享 W_hh 的梯度，要把各时间步贡献累加。只算当前输出到当前隐藏状态会漏掉未来路径。截断 BPTT 用分段计算降低内存与传播长度，但会丢掉跨截断边界的梯度。'),C('长链乘积为何容易出问题','梯度包含多次 Jacobian 相乘，尺度可能指数衰减或增长。tanh 饱和会进一步压小导数。梯度裁剪主要限制梯度爆炸，不能直接补回消失的梯度；初始化、结构与门控也很重要。'),C('LSTM 给记忆一条可控通路','遗忘门控制保留旧 cell state，输入门控制加入新信息，输出门控制暴露多少记忆。cell state 的加法路径有助于长程传播，但并不保证无限记忆。训练时 teacher forcing 使用真实前一 token，生成时通常使用模型自己的输出，二者可能产生分布差异。')],
formula:'hₜ=tanh(xₜW_xh+hₜ₋₁W_hh+b)\nL=Σₜ Lₜ；∂L/∂W_hh=Σₜ hₜ₋₁ᵀδₜ\ncₜ=fₜ⊙cₜ₋₁+iₜ⊙gₜ\nhₜ=oₜ⊙tanh(cₜ)\n此处行样本约定；δₜ 已包含未来时间步传回的贡献。',
worked:'若每一步的简化标量导数都是 0.5，跨 20 步的乘积约 9.54×10⁻⁷；若都是 1.5，则约 3325。这只是说明乘积效应的玩具例子，真实 RNN 的 Jacobian 是矩阵且随输入变化。',
pitfall:'同一个模型的不同独立序列间，不应无意复用未清理的隐藏状态。padding token 也不应当作真实监督位置参与损失。',
practice:['沿 A2 的 rnn_step_forward → rnn_forward → rnn_step_backward → rnn_backward 追踪单步与序列版关系。','在纸上展开 T=3 的 RNN，把同一 W_hh 的三条梯度贡献标出。','阅读 CaptioningRNN 的 forward 与 sample，找出训练输入和生成输入的区别；记录 EOS/PAD 的处理。'],
accept:['能解释共享参数如何在时间上累加梯度。','能区分梯度裁剪与门控的作用。','能比较 teacher forcing 和自回归生成。'],
refs:[R('RNN 课件','Lectures/Week04/Week4_RNN.pdf'),R('A2 · RNN Notebook','Assignments/Assignment2/A2_coding/RNN_Transformer/rnn_lstm_captioning.ipynb'),R('A2 · RNN/LSTM 实现','Assignments/Assignment2/A2_coding/RNN_Transformer/utils/rnn_lstm_captioning.py')],
quiz:[Q('07a','序列长度翻倍，标准 RNN 的可学习参数量通常？',['翻倍','不变','变为四倍'],1,'参数沿时间共享；计算量和激活存储可能增加。'),Q('07b','梯度裁剪主要直接处理？',['梯度爆炸','梯度消失','数据泄漏'],0,'裁剪限制范数，不能恢复已经衰减到很小的信号。'),Q('07c','BPTT 对 W_hh 的梯度应当？',['只取最后一步局部梯度','将所有时间步的共享参数贡献相加','只取第一步'],1,'共享参数的总梯度来自所有使用它的节点。')]

concepts:[C('Q 问问题，K 负责匹配，V 提供内容','对每个 query，把它与所有 key 比较产生分数，再用 softmax 变成权重，对 value 加权求和。Q、K、V 可以来自同一序列的不同投影（self-attention），也可以让 query 与 key/value 来自不同来源（cross-attention）。它们不是必须相等的三个副本。'),C('每一行对应一个 query 的选择','Q 为 [B,Tq,dₖ]，K 为 [B,Tk,dₖ]，QKᵀ 为 [B,Tq,Tk]；softmax 沿 key 维。乘 V 后输出 [B,Tq,dᵥ]。除以 √dₖ 有助于控制点积随维度增长的尺度，避免 softmax 过早饱和。'),C('Mask 决定可访问的信息','因果 mask 阻止当前位置读取未来 token，padding mask 阻止读取补齐位置。通常在 softmax 前把禁止位置设为负无穷或足够小的值。把全行都屏蔽会产生无有效注意力的问题，必须由输入和 mask 设计避免。'),C('Transformer 还需要哪些部件？','多头注意力在多个投影子空间聚合信息，再拼接和投影。逐 token FFN 提供非线性变换，位置编码注入顺序，残差和 LayerNorm 支持优化。没有位置信息且没有位置相关 mask 时，自注意力具有置换等变性，无法独自区分序列次序。')],

id:'09',title:'把图像变成 token 序列',en:'ViT & hierarchical attention',phase:'视觉',week:'Week 5',time:'90 分钟',lab:'patches',
goal:'能计算 patch 数和注意力开销，比较 CNN、ViT 与窗口注意力。',prereq:'第 04、08 课。',chain:['切分不重叠 patch','展平并线性投影','加入位置/类别 token','Transformer blocks','汇聚','分类'],
concepts:[C('一个 patch 就是一份局部输入','将 H×W 图像切为 P×P 的非重叠块，块数为 HW/P²（这里假设整除且无额外 padding）。RGB 块展平长度是 3P²，再投影到 d 维。patch embedding 也可用核与步幅均为 P 的卷积实现。'),C('类别 token 是汇聚方式之一','经典 ViT 使用可学习 class token，经过多个 block 与图像 token 交互后供分类头读取；也可以采用全局平均等其他汇聚方式。位置编码帮助区分同一视觉内容出现在不同位置。'),C('patch 越小，序列越长','减小 patch 尺寸保留更细的空间信息，但 token 数和密集注意力开销增长。只看模型参数量会漏掉激活内存的变化。图像分辨率变化还涉及位置编码适配和训练设置。'),C('局部先验与全局交互的取舍','CNN 通过局部连接和权重共享引入空间先验；标准 ViT 可直接进行全局 token 交互，数据和训练配方很重要。Swin 等层级窗口方法限制局部注意力，再通过移动窗口及层级结构传播信息。不能把“Transformer”简单等同于更高准确率。')],
formula:'N = (H/P) × (W/P)\npatch 展平维度 = C×P²\n含 class token 时 T=N+1\n密集注意力每个 head 的分数矩阵 = T×T',
worked:'224×224 RGB 图像，P=16 时 N=14×14=196，含 class token 为 197。P=8 时 N=784，含 class token 为 785；分数矩阵元素比为 785²/197²≈15.9，而不是仅增加 4 倍。',
pitfall:'patch embedding 的权重在各 patch 位置共享，因此投影层参数量不随 patch 数直接线性增长。',
practice:['在互动实验里改变 patch 大小，记录 token 数和注意力矩阵大小。','打开 Tutorial09 的 VitT.ipynb，定位 patch embedding、位置编码和分类头；记录真实张量形状。','在同一训练预算下比较 CNN/ViT 时，列清楚数据增强、预训练、参数量与优化设置，避免不公平对比。'],

{
id:'10',title:'理解 GAN 的两方博弈',en:'GAN, DCGAN & WGAN',phase:'生成',week:'Week 6 · A3',time:'120 分钟',lab:null,
goal:'能分别写出判别器和生成器的一次更新，识别训练不稳定与模式崩溃。',prereq:'第 02、03、06 课；二分类损失。',chain:['采样噪声','生成假样本','更新判别器','重新生成/评分','更新生成器','观察质量与多样性'],
concepts:[C('两张网络优化不同目标','生成器 G 把噪声 z 映射成样本，判别器 D 区分真与假。更新 D 时，假样本应与 G 的梯度图断开；更新 G 时，需要通过 D 对输入的梯度传回 G，但不需要更新 D 的参数。断开错了路径会让生成器完全收不到信号。'),C('生成器损失有常见变体','原始 minimax 中 G 最小化 log(1−D(G(z)))，在某些阶段梯度弱。常用 non-saturating 损失改为 −log D(G(z))，希望假样本被判真。它与原始博弈目标有关联，但不是完全相同的数值表达式。'),C('低 loss 不等于样本好','GAN 训练是动态博弈，两个 loss 会互相影响。模式崩溃指生成器只覆盖少量模式，即使样本看似逼真也缺少多样性。用固定噪声看训练过程，同时用新噪声看覆盖范围；不能只挑最好看的几张。'),C('WGAN 改变的是距离与约束','WGAN 用 critic 的分数差估计 Wasserstein 目标，不把输出直接当真假概率，并需要满足 Lipschitz 约束。WGAN-GP 用梯度惩罚近似约束。DCGAN 是卷积架构设计；LSGAN 则改变对抗损失，二者属于不同维度的选择。')],
formula:'L_D = −Eₓ log D(x) − E_z log(1−D(G(z)))\n常用 non-saturating：L_G = −E_z log D(G(z))\n更新 D：fake = G(z).detach()\n更新 G：fake = G(z)，梯度经过 D(fake) 回到 G\n实际使用 logits 时可用稳定的 BCEWithLogitsLoss。',
worked:'若 D(fake)=0.01，non-saturating 生成器损失为 −ln0.01≈4.605；若变为 0.5，则约 0.693。下降说明当前 D 更难识别该批假样本，但还不能证明覆盖了真实分布的所有模式。',
pitfall:'生成器更新时对 fake 使用 detach，会切断从 D 回到 G 的梯度。忘记分开两个优化器的梯度清零也会污染更新。',
practice:['按 A3 gan.py 的 sample_noise → generator/discriminator → discriminator_loss/generator_loss → get_optimizer 阅读。','在 Notebook 复制件中先画出 D step 和 G step 的计算图，标出 detach 位置。','记录固定噪声网格、随机网格、两方 loss 和训练配置；找证据区分不收敛与模式崩溃。'],
accept:['能说明两次更新各自改变哪些参数。','能解释 detach 在哪一步必要、哪一步有害。','评价报告同时讨论质量、多样性和计算预算。'],
refs:[R('GAN','Lectures/Week06/Week6_GAN.pdf'),R('Advanced GAN','Lectures/Week06/Week6-Advanced GAN.pdf'),R('Tutorial10','Tutorials/Tutorial10/tutorial10.ipynb'),R('A3 · GAN Notebook','Assignments/Assignment3/generative_adversarial_networks.ipynb'),R('A3 · gan.py','Assignments/Assignment3/gan.py')],
quiz:[Q('10a','更新生成器时，应该把 G(z) detach 吗？',['应该，否则无法算 loss','不应该，否则梯度回不到 G','只要 D 很强就应该'],1,'G 需要通过 D 对输入的梯度获得学习信号。'),Q('10b','模式崩溃最接近哪种现象？',['样本多样性不足，只生成少数模式','每张图都有随机噪声','模型文件太大'],0,'逼真程度与分布覆盖是两个维度。'),Q('10c','WGAN 的 critic 输出通常被直接解释为？',['归一化的真假概率','不必归一化为概率的实数分数','像素标签'],1,'WGAN 的目标与二分类概率判别不同。')]
},

id:'11',title:'从加噪走到生成',en:'Diffusion & latent diffusion',phase:'生成',week:'Week 6 · A3',time:'120 分钟',lab:'diffusion',
goal:'能区分前向加噪、训练噪声预测器和反向采样，理解条件控制。',prereq:'第 02、06、10 课；高斯噪声、均方误差。',chain:['干净样本 x₀','随机时间步 t','构造带噪 xₜ','预测噪声','MSE 更新网络','从噪声逐步采样'],
concepts:[C('前向过程是已知的扰动机制','给定噪声日程 βₜ，逐步把数据混入高斯噪声。用累计乘积 ᾱₜ 可以直接从 x₀ 构造任意时间步 xₜ，不必从 1 一步步模拟。模型接收时间步，因为不同噪声水平对应不同去噪难度。'),C('训练目标与采样过程不同','常见 ε-parameterization 训练模型预测加入的噪声，用均方误差监督。一次训练只需随机抽一个 t；生成时从随机噪声出发，按选定采样器反复调用网络。预测噪声不是简单把噪声图输出后“自动得到照片”，还需要反向更新公式。'),C('一个样本的噪声不代表一条完整轨迹','把同一个固定 ε 代入不同 ᾱₜ，可以直观看边际加噪程度，但不是逐步独立加噪的 Markov 轨迹。互动示意使用这种耦合方式，方便观察信号强度；它没有加载或训练去噪模型。'),C('潜空间与条件控制降低或改变成本','Latent diffusion 先用编码器压缩图像，在潜空间做扩散，再解码。条件可通过 cross-attention 等方式进入网络。Classifier-free guidance 组合无条件与有条件预测，强度过高可能损害多样性或产生伪影；ControlNet、LoRA、DreamBooth 是不同的控制或适配思路。')],
formula:'αₜ=1−βₜ；ᾱₜ=∏ₛ₌₁ᵗ αₛ\nxₜ=√ᾱₜ x₀ + √(1−ᾱₜ) ε，ε~N(0,I)\nL_simple=E[‖ε−εθ(xₜ,t,c)‖²]\n常见 CFG 约定：ε_guided=ε_uncond+s(ε_cond−ε_uncond)\n此约定中 s=0 为无条件，s=1 为条件预测。',
worked:'ᾱₜ=0.81 时，信号系数是 0.9，噪声系数 √0.19≈0.436。它们不是直接相加等于 1 的混合权重；在信号与噪声独立且单位方差时，两项方差之和为 1。',
pitfall:'训练只随机抽一个时间步，不代表生成只需一步。生成步数、采样器与模型训练目标应配套，不能随意套反向公式。',
practice:['在互动加噪图中比较低、中、高 ᾱ，说明“信号系数”和“噪声标准差”的区别。','阅读 Tutorial11 diffusion_tutorial.ipynb，分开记录预训练推理、模型适配与从头训练的代码段。','按 A3 要求设计 MNIST 上 GAN 与 diffusion 的公平对比：数据、分辨率、预算、样本数、质量/多样性指标及采样耗时。'],
accept:['能手写直接加噪公式并解释每个符号。','能区分训练一步与采样多步。','知道本页加噪实验不是真实生成模型。'],
refs:[R('Diffusion','Lectures/Week06/Week6-Diffusion.pdf'),R('Tutorial11 · Diffusion','Tutorials/Tutorial11/diffusion_tutorial.ipynb'),R('A3 · 实验要求','Assignments/Assignment3/Assignment_3.pdf')],
quiz:[Q('11a','当 ᾱ=0.81 时，信号 x₀ 的系数是？',['0.81','0.9','0.19'],1,'系数为 √ᾱ=0.9。'),Q('11b','常见噪声预测训练，一次更新必须遍历所有时间步吗？',['必须','通常随机抽样时间步即可','只用最后一步即可'],1,'对时间步采样来估计期望损失，不必每次展开完整采样链。'),Q('11c','潜空间 diffusion 的主要流程是？',['直接在标签上去噪','编码到潜空间→扩散→解码','只训练判别器'],1,'扩散发生在压缩表示中，编码解码器的质量也会影响最终结果。')]
},

id:'12',title:'从识别类别到定位对象',en:'Object detection & evaluation',phase:'视觉任务',week:'Week 7',time:'90–120 分钟',lab:'iou',
goal:'能计算 IoU，解释 NMS、AP 和检测器的分类/定位分工。',prereq:'第 01、04、08 课。',chain:['图像特征','产生候选框','类别与坐标预测','置信度筛选','NMS/集合预测','匹配并评价'],
concepts:[C('一个预测同时包含“是什么”和“在哪里”','检测输出不固定数量的对象类别、边界框与分数。训练要建立预测和真值间的分配关系，再计算分类和定位损失。两阶段方法先产生候选再精细识别；单阶段方法密集预测。实际速度与精度取决于具体实现和设置。'),C('IoU 是几何重叠，不是概率','框 A、B 的交并比为交集面积除以并集面积。相交宽高必须截断为非负。坐标 convention 要统一：连续坐标的面积不能随意加 1。IoU 对小框的坐标误差尤其敏感。'),C('NMS 解决重复预测','标准贪心 NMS 先保留高分框，再抑制与它 IoU 超阈值的同类候选。阈值更低通常更容易抑制重叠框，可能误伤拥挤场景的不同对象。不同变体可能跨类或按类处理，说明实现约定很重要。'),C('AP 不等于某个阈值上的 accuracy','按分数排序，基于指定 IoU 阈值和匹配规则标记 TP/FP，形成 precision–recall 曲线并计算 AP。mAP 再对类别或多个 IoU 阈值求平均，必须说明协议。重复检测同一真值不能都算 TP。DETR 用集合预测与匹配设计，不能把标准 NMS 流程套到所有检测器。')],
formula:'IoU(A,B)=area(A∩B)/[area(A)+area(B)−area(A∩B)]\n交集宽=max(0,min(x₂ᴬ,x₂ᴮ)−max(x₁ᴬ,x₁ᴮ))\n交集高同理；连续坐标约定，不额外 +1\nAP：在明确匹配及插值协议下对 PR 曲线汇总。',

pitfall:'不要把置信度阈值、NMS IoU 阈值和评价匹配 IoU 阈值当作同一个参数。它们作用在不同阶段。',
practice:['在互动框图中移动预测框，手算一组 IoU 后核对。','运行 Tutorial12 的复制件，记录输入尺寸、框坐标格式、类别和 confidence。','固定模型，分别改变置信度与 NMS 阈值，观察漏检与重复框；评价时保持匹配协议不变。'],
accept:['能手算 1/7 的框重叠例子。','能解释 NMS 阈值与评价阈值不同。','报告中写清 AP50 或多 IoU 阈值 mAP 的具体定义。'],
refs:[R('Object Detection','Lectures/Week07/Week7-Object-detection.pdf'),R('Tutorial12','Tutorials/Tutorial12/object_detection_tutorial.ipynb')],
quiz:[Q('12a','两个面积为 4 的框，交集为 1，IoU 是？',['1/4','1/7','1/8'],1,'并集=4+4−1=7。'),Q('12b','标准贪心 NMS 的 IoU 阈值调低，通常会？',['抑制更多重叠候选','保留更多重复框','改变真值标签'],0,'更小重叠即可超过阈值，所以抑制更强。'),Q('12c','一个真值被两个预测重复命中，标准一对一评价通常怎样计数？',['两个都算 TP','只允许一个匹配为 TP','两个都自动忽略'],1,'匹配过的真值不能被重复计为多个 TP。')]

id:'13',title:'给每个像素一个判断',en:'Segmentation & dense prediction',phase:'视觉任务',week:'Week 7',time:'90 分钟',lab:'iou',
goal:'能区分语义/实例分割，解释上采样、跳连和分割评价。',prereq:'第 04、05、12 课。',chain:['编码空间特征','融合不同尺度','恢复分辨率','输出像素 logits','生成 mask','按类计算指标'],
concepts:[C('语义与实例回答不同问题','语义分割给每个像素分配类别；实例分割进一步区分同类的不同对象。全景分割结合可数对象与背景区域的统一标注。检测框描述粗定位，分割 mask 描述更精细的形状。'),C('编码器压缩，解码器恢复','下采样获得更大感受野但损失空间细节。FCN 用卷积化输出与上采样恢复密集预测；U-Net 类跳连融合浅层高分辨率信息和深层语义。插值、转置卷积与其他上采样方式有不同的参数和伪影风险。'),C('空洞卷积扩大采样范围','dilation 在核元素间引入间隔，在不一定降低输出分辨率的条件下扩大理论感受野。它不会因为插入空位而增加同一核的可学习权重数，但采样网格可能带来栅格效应。'),C('像素准确率会被背景主导','背景占 95% 的图片，全预测背景也可能获得很高像素准确率。按类 IoU 与 Dice 能更好暴露少数类问题。计算 mIoU 时必须明确忽略标签、缺失类别和背景是否纳入。提示驱动分割还要说明使用的点、框等提示，不能与无提示方法不加说明地比较。')],

worked:'某类 TP=30、FP=10、FN=20，则 IoU=30/60=0.5，Dice=60/90≈0.667。若这一类很稀少，整体像素 accuracy 仍可能很高，因此必须按类查看。',

concepts:[C('同一个反传工具，可以优化不同变量','训练分类器通常对 θ 求梯度；图像可视化和风格迁移可以固定 θ，对输入图像 x 求梯度。冻结网络参数不意味着切断所有输入梯度，若用 no_grad 包住整个前向，就无法完成这类输入优化。'),C('显著图描述局部敏感性','对目标类别得分关于输入的梯度，可观察小扰动在哪些位置影响输出。梯度受尺度和局部非线性影响，不能直接当成可靠因果解释。不同类别、预处理和可视化归一化会改变结果。'),C('对抗样本需要明确威胁模型','一个简单非定向攻击沿增大分类损失的方向扰动输入，同时约束扰动范数并裁剪合法像素范围。目标攻击的方向与目标损失定义不同。评价必须说明 ε 的尺度、输入是否标准化、攻击次数与是否使用真实标签。'),C('风格迁移约束特征统计','内容损失比较特征空间中的结构，风格损失用 Gram 矩阵描述通道相关统计，总变差损失抑制局部不平滑。Gram 统计弱化了空间排列，并不直接复制某幅画的具体布局。不同损失的归一化和权重决定优化平衡。')],

worked:'特征为 [64,32,32]，展平后 F=[64,1024]，Gram 为 [64,64]，不是 [1024,1024]。它统计不同通道在空间位置上的共同激活，丢失了精确位置排列。',

const DEPTH={
'01':{title:'从独立样本似然到平均交叉熵',assumption:'监督分类；样本在给定模型下独立，目标是 one-hot 标签。',steps:[['定义单样本概率','模型给出 pθ(yᵢ|xᵢ)。所有样本同时出现的条件似然为 ∏ᵢ pθ(yᵢ|xᵢ)。'],['把乘积转为求和','取负对数：NLL=−Σᵢ log pθ(yᵢ|xᵢ)。log 单调递增，因此最大化似然等价于最小化 NLL。'],['用 one-hot 写成统一形式','−log pθ(yᵢ|xᵢ)=−Σ꜀ yᵢ꜀ log pᵢ꜀。仅正确类别的 y 为 1，其余为 0。'],['明确归约与泛化边界','除以 N 得平均交叉熵；最优点在不含其他项时不变，但梯度尺度改变。损失降低是训练目标改善，泛化仍要通过独立数据评价。']],torch:'数据集与 DataLoader；在训练集拟合预处理；batch 与 epoch 的关系。',code:'from torch.utils.data import TensorDataset, DataLoader\n# X_train: [N,D] float；y_train: [N] long\nloader = DataLoader(TensorDataset(X_train, y_train),\n                    batch_size=64, shuffle=True, num_workers=0)\nfor xb, yb in loader:\n    logits = model(xb)  # [B,C]\n    loss = torch.nn.functional.cross_entropy(logits, yb)',verify:'核对首尾 batch 大小；验证集不 shuffle 也不重新拟合均值方差。Windows 脚本先用 num_workers=0，避免把多进程问题混进模型学习。'},
'02':{title:'线性层的形状、梯度与自动微分',assumption:'行样本 X:[B,D]；数学权重 W:[D,H]；Y=XW+b。',steps:[['微分乘积','dY=dX·W+X·dW+db。把三个变化来源分开，避免只记形状猜公式。'],['引入上游梯度','令 G=∂L/∂Y:[B,H]。标量损失的微分是 dL=Σᵢⱼ GᵢⱼdYᵢⱼ。'],['按系数收集','代入后收集 dX、dW、db 的系数：∂L/∂X=GWᵀ，∂L/∂W=XᵀG，∂L/∂b=Σ_batch G。'],['对应框架约定','nn.Linear(D,H) 的 weight:[H,D]，所以 weight.grad=GᵀX。不是推导矛盾，而是存储约定转置了。']],torch:'叶子张量、requires_grad、grad 累加、detach 与 no_grad。',code:'import torch\nx = torch.tensor(2.0, requires_grad=True)\ny = x * x + 3 * x\ny.backward()\nprint(x.grad)  # 7 = 2x+3\n# nn.Linear(D,H).weight 的形状是 [H,D]\n# backward 计算梯度；optimizer.step 才更新参数。',verify:'自己将 y 改为 x³−2x，先预测 x=2 的导数，再与 autograd 对照。不要通过 detach().numpy() 构造需要继续反传的损失。'},
'03':{title:'真正推出 softmax + CE 的 p−y',assumption:'单样本；z:[C]；pⱼ=exp(zⱼ)/Σₖexp(zₖ)；Σⱼyⱼ=1。',steps:[['求 softmax 的局部导数','商法则给出 ∂pᵢ/∂zⱼ=pᵢ(𝟙[i=j]−pⱼ)。i=j 时为 pᵢ(1−pᵢ)，否则为 −pᵢpⱼ。不能只取对角项。'],['交叉熵对概率求导','L=−Σᵢyᵢlog pᵢ，所以 ∂L/∂pᵢ=−yᵢ/pᵢ。'],['链式法则并化简','∂L/∂zⱼ=Σᵢ(−yᵢ/pᵢ)·pᵢ(𝟙[i=j]−pⱼ)=−yⱼ+pⱼΣᵢyᵢ=pⱼ−yⱼ。'],['扩展到 MLP 与 batch','batch 平均得到 δ₂=(P−Y)/B；W₂ 梯度为 Hᵀδ₂；δ₁=(δ₂W₂ᵀ)⊙σ′(A₁)。偏置沿 batch 求和。若两路共享 W，来自两路的 W 梯度相加。']],torch:'CrossEntropyLoss 的 logits/long 标签契约；reduction；梯度检查。',code:'import torch\nz = torch.tensor([[1., 0., -1.]], requires_grad=True)\ntarget = torch.tensor([1])\nloss = torch.nn.functional.cross_entropy(z, target)\nloss.backward()\nexpected = z.detach().softmax(-1) - torch.tensor([[0.,1.,0.]])\nassert torch.allclose(z.grad, expected)\nprint(loss.item(), z.grad)',verify:'把 batch 复制两遍并采用 mean，观察每个样本梯度缩小一半；改成 sum 再比较。课程目录下已有 gradient_check.py 可检验两层 MLP 的解析梯度。'},
'04':{title:'卷积为什么能共享参数？反传又如何累加？',assumption:'先用一维、单通道、stride=1、padding=0 的互相关说明。',steps:[['写出前向和合法位置','yₜ=Σⱼ₌₀ᵏ⁻¹ wⱼxₜ₊ⱼ。一个宽 k 的窗口在宽 n 的输入里有 n−k+1 个合法位置。'],['对同一个核权重求导','若上游梯度为 gₜ，则 ∂L/∂wⱼ=Σₜgₜxₜ₊ⱼ。wⱼ 在所有位置使用，所以所有位置贡献必须求和。'],['对一个输入位置求导','∂L/∂xᵢ=Σₜgₜwᵢ₋ₜ，只累加满足 0≤i−t<k 的项。同一个输入可能被多个窗口覆盖。'],['推广维度并检验','二维多通道再对核的两个空间维和输入通道求和。有效核宽 d(k−1)+1；输出宽度为 floor((n+2p−d(k−1)−1)/s)+1。']],torch:'NCHW、Conv2d 权重 [Cout,Cin/groups,kH,kW]、flatten 与池化。',code:'import torch\nfrom torch import nn\nx = torch.randn(2,3,32,32, requires_grad=True)\nconv = nn.Conv2d(3,16,3,padding=1)\ny = conv(x)\ny.square().mean().backward()\nprint(y.shape, conv.weight.grad.shape, x.grad.shape)\n# [2,16,32,32], [16,3,3,3], [2,3,32,32]',verify:'用一个 5×5 输入手写单通道前向，与 F.conv2d 对照；先不写高性能卷积，重点验证边界和梯度累加。'},
'05':{title:'残差、归一化与 Dropout 的数学边界',assumption:'残差分支维度匹配；倒置 Dropout 使用独立 Bernoulli mask；归一化忽略具体 running-stat 更新细节。',steps:[['残差的直接梯度','y=x+F(x)，Jacobian 是 I+J_F。上游行梯度 g 变为 g(I+J_F)，其中 g 可以沿恒等路径直接传播。'],['归一化不是只有除标准差','x̂=(x−μ)/√(σ²+ε)。训练阶段 μ、σ²依赖输入，因此对输入求导也要包含均值与方差的路径；不能把它们都当常数。'],['区分 BN 与 LN 的统计轴','对 [B,D]，BN 通常跨 B 统计每个特征；LN 通常在每个样本内部跨 D 统计。对卷积 BN2d，统计轴还包括空间维。两者不是只换名字。'],['推出 Dropout 的期望补偿','m~Bernoulli(1−p)，训练输出 mx/(1−p)。E[mx/(1−p)]=x；p<1 时 Var= x²p/(1−p)。单次采样不等于期望。']],torch:'train/eval 与梯度开关；BN buffers；Dropout；state_dict。',code:'import torch\nfrom torch import nn\nx = torch.ones(8)\ndrop = nn.Dropout(p=0.5)\ndrop.train(); print(drop(x))  # 元素为 0 或 2\ndrop.eval(); print(drop(x))   # 全 1\n# eval 不等于 no_grad；BN 的 running_mean/var 是 buffer。',verify:'在归一化实验里只放大一个样本，比较另一个样本的 BN/LN 输出。再用 Dropout 实验比较单次输出和多次平均。'},
'06':{title:'从二次函数稳定性到 Adam 偏置修正',assumption:'稳定性推导只针对确定性标量二次函数；Adam 按常见 EMA 约定。',steps:[['求更新递推式','L=aw²/2，∇L=aw。GD 得 wₜ₊₁=(1−ηa)wₜ，于是 wₜ=(1−ηa)ᵗw₀。'],['得到稳定区间','趋于 0 需要 |1−ηa|<1，即 0<ηa<2。0<ηa<1 同号衰减；1<ηa<2 交替衰减；边界不衰减。'],['解释动量的状态','本页二维实验采用 vₜ=βvₜ₋₁+gₜ，θₜ₊₁=θₜ−ηvₜ。它与带 (1−β) 的 EMA 约定需换算步长后比较。'],['推出 EMA 零初始化偏差','若梯度恒为 g，m₀=0，则 mₜ=(1−β₁ᵗ)g；除以 1−β₁ᵗ 恢复 g。Adam 对 v 同样修正，然后用 m̂/(√v̂+ε) 更新。']],torch:'optimizer 状态、学习率组、scheduler 调用位置、梯度范数与性能记录。',code:'# model、xb、yb 已定义\noptimizer.zero_grad(set_to_none=True)\nlogits = model(xb)\nloss = torch.nn.functional.cross_entropy(logits, yb)\nloss.backward()\ngrad_norm = torch.sqrt(sum(p.grad.square().sum()\n                          for p in model.parameters() if p.grad is not None))\noptimizer.step()\n# 比较 epoch、optimizer step 和实际耗时，不能只看 loss 的终值。',verify:'运行 Code/experiments/optimizer_study.py。比较相同步数与相同时间两个视角，记录目标阈值没有达到的情况，不替它编一个达到时间。'},
'07':{title:'把 BPTT 的“未来梯度”写出来',assumption:'列向量约定：hₜ=tanh(Wxₜ+Uhₜ₋₁+b)，zₜ=Vhₜ+c；单序列，每步 CE 求和。',steps:[['输出层误差','令 eₜ=pₜ−yₜ。当前时刻输出损失传回隐藏状态的贡献是 Vᵀeₜ。'],['加入未来贡献','隐藏状态还影响 hₜ₊₁。若 δₜ=∂L/∂aₜ，aₜ 是 tanh 前输入，则 ∂L/∂hₜ=Vᵀeₜ+Uᵀδₜ₊₁。末端未来项为 0。'],['通过激活局部导数','δₜ=(Vᵀeₜ+Uᵀδₜ₊₁)⊙(1−hₜ²)。必须逆时间计算，不能只把当前输出梯度往回传一次。'],['累加共享参数贡献','∂L/∂U=Σₜδₜhₜ₋₁ᵀ，∂L/∂W=Σₜδₜxₜᵀ，∂L/∂b=Σₜδₜ。这里与前面行样本公式约定不同，已明确标注。']],torch:'Embedding、batch_first、padding mask、hidden.detach 与截断 BPTT。',code:'import torch\nfrom torch import nn\nrnn = nn.GRU(input_size=8, hidden_size=16, batch_first=True)\nx = torch.randn(2,5,8)\noutput, h = rnn(x)\nprint(output.shape, h.shape)  # [2,5,16], [1,2,16]\n# 连续序列分块训练时可在分块边界 h=h.detach() 截断图。\n# 不相关样本不应无意继承前一序列隐藏状态。',verify:'先在两步手写 RNN 上对 U 做数值梯度检查；再进入课程的 rnn_step_backward/rnn_backward。'},
'08':{title:'Attention 前向与四步反向',assumption:'单 head、单 batch；Q:[Tq,d]，K:[Tk,d]，V:[Tk,dv]；mask 固定。',steps:[['明确四个中间量','S=QKᵀ/√d+M；A=softmax_row(S)；O=AV。每个 query 行的 A 对可见 key 和为 1。'],['穿过加权和','给定 G=∂L/∂O，则 ∂L/∂V=AᵀG，∂L/∂A=GVᵀ。'],['穿过逐行 softmax','每行 gSⱼ=Aⱼ(gAⱼ−ΣₖAₖgAₖ)。这利用 softmax Jacobian，避免显式构造完整矩阵。被 mask 的位置视为固定不可访问位置。'],['穿过点积投影','∂L/∂Q=gS·K/√d；∂L/∂K=gSᵀ·Q/√d。若 Q=XWq，再用线性层反传求 Wq 和 X；多头按相应维度组织。']],torch:'reshape/transpose/contiguous、head 维度、bool/additive mask、数值稳定性。',code:'import torch, math\nq = torch.randn(2,4,8, requires_grad=True)\nk = torch.randn(2,4,8, requires_grad=True)\nv = torch.randn(2,4,6, requires_grad=True)\nscores = q @ k.transpose(-2,-1) / math.sqrt(8)\nfuture = torch.triu(torch.ones(4,4,dtype=torch.bool),1)\na = scores.masked_fill(future, float("-inf")).softmax(-1)\nout = a @ v\nout.square().mean().backward()',verify:'把上面的四步解析反向与 autograd 对照。注意 API 的 bool mask 语义可能不同，换接口时查该接口文档，不能凭变量名猜。'},
'09':{title:'Patch 数为什么让 attention 平方增长？',assumption:'正方形图像、整除的非重叠 patch；密集全局注意力。',steps:[['计算 token 数','N=(H/P)(W/P)，含 class token 时 T=N+1。'],['计算投影维度','每个 RGB patch 有 3P² 个输入值，线性投影参数为 (3P²)d+d，不按 patch 个数另建一份。'],['区分参数与激活','QKᵀ 的每个 head 有 T² 个分数。patch 边长减半时 N 约变为四倍，分数矩阵约十六倍。'],['解释近似条件','class token 和其他中间激活让比例不是精确十六倍；窗口 attention 的复杂度关系又不同。']],torch:'Conv2d patch embedding、flatten/transpose、位置参数、预训练权重形状。',code:'import torch\nfrom torch import nn\nembed = nn.Conv2d(3,64,kernel_size=16,stride=16)\nx = torch.randn(2,3,224,224)\ntokens = embed(x).flatten(2).transpose(1,2)\nprint(tokens.shape)  # [2,196,64]\n# transpose 后不要假定张量连续；不确定时用 reshape。',verify:'运行 tensor_shapes.py，将 P=16 改成 8，预测 token 与注意力矩阵大小；不需要训练完整 ViT。'},
'10':{title:'BCE logits 梯度与 GAN 两次更新',assumption:'D 输出 logit a，p=sigmoid(a)；本节说明常见 non-saturating G loss。',steps:[['稳定 BCE 形式','对 y∈{0,1}，L=softplus(a)−ya。它等价于 −ylogσ(a)−(1−y)log(1−σ(a))。'],['对 logit 求导','softplus 导数是 σ(a)，所以 ∂L/∂a=σ(a)−y。D 对真实样本取 y=1、假样本取 y=0。'],['更新 D 时断开 G','fake=G(z).detach()，D_loss 两项反传只需更新 D。避免无意为 G 累加梯度。'],['更新 G 时保留输入路径','G_loss=BCEWithLogits(D(G(z)),1)。即使冻结 D 的参数，也不能 no_grad 包住 D 的整个前向，因为 G 仍要经 D 对输入的导数接收梯度。']],torch:'detach vs requires_grad_(False)；两个 optimizer；BCEWithLogitsLoss。',code:'# G、D 和 opt_g 已定义；此片段为 G step\nfor p in D.parameters(): p.requires_grad_(False)\nopt_g.zero_grad(set_to_none=True)\nfake = G(z)\nscore = D(fake)\nloss_g = torch.nn.functional.binary_cross_entropy_with_logits(\n    score, torch.ones_like(score))\nloss_g.backward(); opt_g.step()\nfor p in D.parameters(): p.requires_grad_(True)',verify:'临时检查 G 参数 .grad：正确 G step 应有有限梯度。把 fake detach 后解释为什么路径断开，再恢复。'},
'11':{title:'DDPM 直接加噪公式如何得到？',assumption:'前向噪声各步独立、标准高斯；αₜ=1−βₜ。只推导前向边际，不声称完整推导 ELBO。',steps:[['写一步转移','xₜ=√αₜxₜ₋₁+√(1−αₜ)εₜ。'],['展开两步','代入 xₜ₋₁，信号系数为 √(αₜαₜ₋₁)，两项独立高斯噪声的方差是 αₜ(1−αₜ₋₁)+(1−αₜ)=1−αₜαₜ₋₁。'],['递推到任意时间','重复得到 ᾱₜ=∏ₛ₌₁ᵗαₛ，xₜ=√ᾱₜx₀+√(1−ᾱₜ)ε，其中合成后的 ε 仍是标准高斯。'],['区分边际与条件逆过程','可以直接采样任意 t 的边际带噪图来训练 εθ。反向采样还需要选定参数化和更新公式；知道此式不等于已推导整个 DDPM。']],torch:'时间步索引、广播到 BCHW、randn_like、MSE 与条件输入。',code:'# x0: [B,C,H,W]，alpha_bar: [T]，model 预测噪声\nt = torch.randint(len(alpha_bar), (x0.shape[0],), device=x0.device)\na = alpha_bar[t].view(-1,1,1,1)\neps = torch.randn_like(x0)\nxt = a.sqrt()*x0 + (1-a).sqrt()*eps\npred = model(xt, t)\nloss = torch.nn.functional.mse_loss(pred, eps)',verify:'在固定 x₀ 与多个独立噪声样本上测经验均值/方差，与公式比较；潜空间版还需要理解编码器尺度，不直接套像素参数。'},
'12':{title:'NMS 是一个有顺序的贪心算法',assumption:'同一类别、连续坐标、框面积为正；标准贪心 NMS。',steps:[['先按 score 降序排列','最先处理最高分框，这一步体现算法的贪心选择。'],['选一个框并计算剩余重叠','保留当前最高分框 b，对所有尚未处理框算 IoU(b,·)。'],['抑制超过阈值的候选','本实验用 IoU>threshold 抑制。等于阈值时保留；说明这个比较符号才能精确重现边界结果。'],['循环到没有剩余候选','再选剩余最高分框，直到候选为空。同类拥挤目标可能被误抑制；Soft-NMS、集合预测采用不同机制。']],torch:'坐标约定、向量化 IoU、候选过滤、设备与 dtype 一致。',code:'# boxes: [N,4]，连续 xyxy；a、b 均为单框\nlt = torch.maximum(a[:2], b[:2])\nrb = torch.minimum(a[2:], b[2:])\ninter = (rb-lt).clamp_min(0).prod()\narea_a = (a[2:]-a[:2]).clamp_min(0).prod()\narea_b = (b[2:]-b[:2]).clamp_min(0).prod()\niou = inter / (area_a+area_b-inter).clamp_min(1e-8)',verify:'在新增 NMS 实验里改变阈值，解释哪个框因为谁被抑制；然后用 4 个框手写循环对照。'},
'13':{title:'从计数关系推出 Dice 与 IoU',assumption:'同一非空二值预测/真值 mask，不含额外平滑项。',steps:[['写两个定义','IoU=TP/(TP+FP+FN)，Dice=2TP/(2TP+FP+FN)。'],['引入共同分母','设 U=TP+FP+FN，则 Dice=2TP/(U+TP)。'],['同除 U','Dice=2(TP/U)/(1+TP/U)=2IoU/(1+IoU)。空并集时该推导不能直接用于 0/0。'],['区别评价值与可微代理','硬 mask 指标用于评价；训练中的 soft Dice 可能加平滑项并使用概率，其梯度与这里的计数公式不是同一个对象。']],torch:'argmax 只在评价路径；标签 long；ignore_index；插值恢复空间尺寸。',code:'# logits:[B,C,H,W]，target:[B,H,W] long\nloss = torch.nn.functional.cross_entropy(logits, target, ignore_index=255)\nwith torch.no_grad():\n    pred = logits.argmax(dim=1)\n    valid = target != 255\n    # 按类统计 TP/FP/FN；明确空类的处理约定。',verify:'构造一个手算的 3×3 mask，核对 FP/FN 方向；再构造全空类，明确约定而不是让 NaN 混入平均。'},
'14':{title:'Gram 矩阵的形状与输入优化',assumption:'特征 F:[C,S]，S=HW；目标 A:[C,C] 对称；这里只给未归一化的 L=||FFᵀ−A||²_F。',steps:[['Gram 的每个元素','Gᵢⱼ=ΣₛFᵢₛFⱼₛ，统计通道 i,j 的空间共激活，G:[C,C]。'],['对矩阵平方差求导','令 E=FFᵀ−A，dL=2 tr(EᵀdG)。'],['代入乘积微分','dG=dF·Fᵀ+F·dFᵀ；A 对称时 E 也对称，收集 dF 得 ∂L/∂F=4EF。'],['传播到图像并说明尺度','再沿特征提取网络传回输入 x。若 Gram 或 loss 除以 C、S 等常数，梯度要带上对应因子；不同教程约定不能直接混用权重。']],torch:'固定网络参数、输入 requires_grad、优化输入 tensor；detach 后的展示副本。',code:'# feature_net 已加载；固定其参数但保留输入计算图\nfor p in feature_net.parameters(): p.requires_grad_(False)\nx = content_image.clone().requires_grad_(True)\noptimizer = torch.optim.Adam([x], lr=0.01)\n# 每步计算特征/损失 → backward → step\n# 可视化时使用 x.detach()，而不是在损失路径 detach。',verify:'用一个 2×3 的 F，对 4(FFᵀ−A)F 做 autograd 对照，再考虑归一化后的形式。'},
'15':{title:'把“收敛更快”拆成可检验的指标',assumption:'比较同一任务、相同 loss 定义与归约；评价阈值在看结果之前确定。',steps:[['先定义横轴','epoch 是遍历数据次数；step 是参数更新次数；wall time 是真实时间。batch 变大后，同 epoch 的 step 数会变少。'],['定义达到阈值的时间','选择验证指标阈值，例如 accuracy≥0.90。记录首次达到的 step/time，并同时检查是否稳定。没有达到就记未达到。'],['控制初始条件','固定划分、初始参数和 batch 顺序比较主要变量；再多种子重复。记录初始化/排序变化与数据划分变化的区别。'],['限制结论的范围','更快降低训练 loss 不必然提高泛化；不同优化器需要公平调参预算。保存配置、日志和环境，避免只挑某次最好结果。']],torch:'checkpoint 中的 model/optimizer/scheduler/scaler 状态；随机状态与采样器进度；计时与 profiler。',code:'# 用于恢复训练的 checkpoint 至少需要模型和优化器状态\ntorch.save({"model": model.state_dict(),\n            "optimizer": optimizer.state_dict(),\n            "epoch": epoch}, "checkpoint.pt")\nckpt = torch.load("checkpoint.pt", weights_only=True, map_location="cpu")\nmodel.load_state_dict(ckpt["model"])\noptimizer.load_state_dict(ckpt["optimizer"])\n# 完整续训还需按训练设置恢复随机、scheduler、scaler、采样进度等。',verify:'本次 optimizer_study.py 已提供固定 CPU 下一 batch 的恢复一致性检查。自己添加 Dropout 后，考虑还缺哪些随机状态。'}
};

 const s={version:1,last:COURSE.some(l=>l.id===raw.last)?raw.last:'01',answers:{},mistakes:{},checks:{},notes:{},completed:{}};
 for(const q of allQuestions){const a=raw.answers?.[q.id];if(a&&Number.isInteger(a.choice)&&a.choice>=0&&a.choice<q.options.length)s.answers[q.id]={choice:a.choice,correct:a.choice===q.answer,attempts:Math.max(1,Math.min(9999,Number(a.attempts)||1))};if(raw.mistakes?.[q.id]===true)s.mistakes[q.id]=true;}

function exportState(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cie6032-learning-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('学习记录已导出。');}
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>2000000)throw Error('文件过大（上限 2 MB）');const parsed=validState(JSON.parse(await file.text()));if(!confirm('导入将替换当前的学习进度、答题与笔记。已备份当前记录并继续？'))return;state=parsed;save();route();toast('学习记录已导入。');}catch(error){toast('无法导入：'+error.message);}});
$('#menu-toggle').addEventListener('click',()=>{const open=!$('#sidebar').classList.contains('open');$('#sidebar').classList.toggle('open',open);$('#backdrop').classList.toggle('show',open);$('#menu-toggle').setAttribute('aria-expanded',String(open));});$('#backdrop').addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus();}if(e.key==='Escape')closeMenu();});
window.addEventListener('hashchange',route);route();
</script></body></html>
